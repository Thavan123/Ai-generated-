<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ឃ្លាំងវីដេអូ 100 - សុខភាព និងចំណេះដឹង</title>
    <style>
        :root {
            --bg: #090d16;
            --card: #131c31;
            --text: #f1f5f9;
            --primary: #2563eb;
            --accent: #10b981;
            --border: #1e293b;
        }
        body {
            font-family: 'Khmer OS Siemreap', sans-serif, Arial;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }
        header {
            background: #0f172a;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--primary);
        }
        header h1 {
            margin: 0;
            color: var(--accent);
            font-size: 22px;
        }
        .search-box {
            max-width: 500px;
            margin: 15px auto;
            padding: 0 15px;
        }
        .search-box input {
            width: 100%;
            padding: 10px 15px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .video-card {
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .video-info {
            padding: 12px;
        }
        .video-title {
            font-size: 15px;
            color: #38bdf8;
            margin: 0;
        }
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            border-top: 1px solid var(--border);
            color: #64748b;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎥 ឃ្លាំងវីដេអូចំណេះដឹង និងសុខភាព (100 វីដេអូ)</h1>
        <p style="margin: 5px 0 0 0; font-size: 13px; color: #94a3b8;">ស្វែងរក និងមើលវីដេអូសាធារណៈបានយ៉ាងងាយស្រួល</p>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ស្វែងរកចំណងជើងវីដេអូ..." onkeyup="filterVideos()">
        </div>
    </header>

    <div class="container">
        <div class="video-grid" id="videoGrid">
            <!-- វីដេអូនឹងត្រូវបានផ្ទុកដោយស្វ័យប្រវត្តតាមរយៈ JavaScript ខាងក្រោម -->
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Mega Video Hub.</p>
    </footer>

    <script>
        // កន្លែងសម្រាប់ដាក់បញ្ជីវីដេអូរហូតដល់ ១០០ (អ្នកអាចបន្តថែម ID វីដេអូ និងចំណងជើងនៅទីនេះ)
        const videos = [
            { id: "jfKfPfyJRdk", title: "១. តន្ត្រីសម្រាកខួរក្បាល និងសុខភាពរាងកាយ" },
            { id: "J---aiyznGQ", title: "២. ស្វែងយល់ពីធម្មជាតិ និងលំហអាកាស" },
            { id: "ZXsQAXx_ao0", title: "៣. គន្លឹះជោគជ័យ និងការអភិវឌ្ឍខ្លួន" },
            { id: "8JJ101D3knE", title: "៤. បច្ចេកវិទ្យាទំនើប និងអនាគត" },
            // អ្នកអាចថែមរហូតដល់ ១០០ តាមទម្រង់នេះ៖
            // { id: "ID_វីដេអូ_ទី៥", title: "៥. ចំណងជើងវីដេអូ" },
        ];

        function displayVideos(list) {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = "";
            list.forEach(video => {
                grid.innerHTML += `
                    <div class="video-card" data-title="${video.title}">
                        <div class="video-wrapper">
                            <iframe src="https://www.youtube.com/embed/${video.id}" allowfullscreen></iframe>
                        </div>
                        <div class="video-info">
                            <h3 class="video-title">${video.title}</h3>
                        </div>
                    </div>
                `;
            });
        }

        function filterVideos() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = videos.filter(v => v.title.toLowerCase().includes(search));
            displayVideos(filtered);
        }

        // បង្ហាញវីដេអូទាំងអស់ពេលចូលវេបសាយដំបូង
        displayVideos(videos);
    </script>

</body>
</html>
