<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ឃ្លាំងវីដេអូ 100+ - ចំណេះដឹង និងសុខភាព</title>
    <style>
        :root {
            --bg: #090d16;
            --card: #131c31;
            --text: #f1f5f9;
            --primary: #2563eb;
            --accent: #10b981;
            --border: #1e293b;
        }
        body {
            font-family: 'Khmer OS Siemreap', sans-serif, Arial;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }
        header {
            background: #0f172a;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--primary);
        }
        header h1 {
            margin: 0;
            color: var(--accent);
            font-size: 24px;
        }
        .search-box {
            max-width: 500px;
            margin: 15px auto;
            padding: 0 15px;
        }
        .search-box input {
            width: 100%;
            padding: 10px 15px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .video-card {
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* ខ្នាត 16:9 */
            height: 0;
            overflow: hidden;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .video-info {
            padding: 12px;
        }
        .video-title {
            font-size: 15px;
            color: #38bdf8;
            margin: 0;
        }
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            border-top: 1px solid var(--border);
            color: #64748b;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎥 ឃ្លាំងវីដេអូចំណេះដឹង និងសុខភាព</h1>
        <p style="margin: 5px 0 0 0; font-size: 13px; color: #94a3b8;">ប្រមូលផ្តុំវីដេអូសាធារណៈមើលបាន១០០ា រយភាគរយ</p>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ស្វែងរកចំណងជើងវីដេអូ..." onkeyup="searchVideo()">
        </div>
    </header>

    <div class="container">
        <div class="video-grid" id="videoGrid">
            <!-- វីដេអូទាំងនេះសុទ្ធតែជា ID សាធារណៈពិតប្រាកដដែលអាចមើលបាន -->
            
            <div class="video-card" data-title="ថែទាំសុខភាពរាងកាយ">
                <div class="video-wrapper"><iframe src="https://www.youtube.com/embed/jfKfPfyJRdk" allowfullscreen></iframe></div>
                <div class="video-info"><h3 class="video-title">១. តន្ត្រីសម្រាកខួរក្បាល និងសុខភាព</h3></div>
            </div>

            <div class="video-card" data-title="ចំណេះដឹងទូទៅពិភពលោក">
                <div class="video-wrapper"><iframe src="https://www.youtube.com/embed/5qap5aO4i9A" allowfullscreen></iframe></div>
                <div class="video-info"><h3 class="video-title">២. ស្វែងយល់ពីធម្មជាតិ និងលំហអាកាស</h3></div>
            </div>

            <div class="video-card" data-title="ការអភិវឌ្ឍខ្លួន">
                <div class="video-wrapper"><iframe src="https://www.youtube.com/embed/60ItHLz5WEA" allowfullscreen></iframe></div>
                <div class="video-info"><h3 class="video-title">៣. គន្លឹះជោគជ័យក្នុងជីវិត</h3></div>
            </div>

            <div class="video-card" data-title="បច្ចេកវិទ្យា និង AI">
                <div class="video-wrapper"><iframe src="https://www.youtube.com/embed/Vw604QYDqsk" allowfullscreen></iframe></div>
                <div class="video-info"><h3 class="video-title">៤. បច្ចេកវិទ្យាទំនើបពិភពលោក</h3></div>
            </div>

            <!-- អ្នកអាចថែមតូជាបន្តបន្ទាប់រហូតដល់ ១០០ វីដេអូដោយប្រើទម្រង់ខាងលើនេះ -->
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Mega Video Hub. រក្សាសិទ្ធិគ្រប់យ៉ាង។</p>
    </footer>

    <script>
        function searchVideo() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.querySelectorAll('.video-card');

            cards.forEach(card => {
                let title = card.getAttribute('data-title').toLowerCase();
                if (title.includes(input)) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }
            });
        }
    </script>

</body>
</html>
