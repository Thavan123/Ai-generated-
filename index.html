            --border: #1e293b;
        }
        body {
            font-family: 'Khmer OS Siemreap', sans-serif, Arial;

            color: var(--text);
            margin: 0;
            padding: 0;
        }
        header {

            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--primary);

        header h1 {
            margin: 0;
            color: var(--accent);
            font-size: 22px;
        }
        .search-box {

            margin: 15px auto;
            padding: 0 15px;

            color: white;
            font-size: 14px;
            outline: none;
        }

            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .video-card {
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .video-info {
            padding: 12px;
        }
        .video-title {
            font-size: 15px;
            color: #38bdf8;
            margin: 0;
        }
        footer {

            padding: 20px;
            margin-top: 30px;
            border-top: 1px solid var(--border);

        function displayVideos(list) {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = "";
            list.forEach(video => {
                grid.innerHTML += `
                    <div class="video-card" data-title="${video.title}">
                        <div class="video-wrapper">
                            <iframe src="https://www.youtube.com/embed/${video.id}" allowfullscreen></iframe>
                        </div>
                        <div class="video-info">
                            <h3 class="video-title">${video.title}</h3>
                        </div>
                    </div>
                `;
            });
        }

        function filterVideos() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = videos.filter(v => v.title.toLowerCase().includes(search));
            displayVideos(filtered);
        }

        // បង្ហាញវីដេអូទាំងអស់ទាំង ១០០ ពេលចូលវេបសាយដំបូង
        displayVideos(videos);
    </script>
