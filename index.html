<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องលេងចម្រៀង និងទំនុកច្រៀង (Custom Music Player)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .player-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 450px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #f39c12;
        }
        .upload-box {
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 10px;
            border: 2px dashed rgba(255, 255, 255, 0.3);
        }
        input[type="file"] {
            color: #fff;
            font-size: 14px;
            width: 100%;
        }
        audio {
            width: 100%;
            margin-bottom: 20px;
            border-radius: 10px;
        }
        .lyrics-container {
            height: 160px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            scroll-behavior: smooth;
        }
        .lyrics-container::-webkit-scrollbar {
            width: 5px;
        }
        .lyrics-container::-webkit-scrollbar-thumb {
            background: #f39c12;
            border-radius: 10px;
        }
        .line {
            font-size: 15px;
            color: #95a5a6;
            margin: 12px 0;
            transition: all 0.3s ease;
        }
        .line.active {
            color: #f1c40f;
            font-size: 18px;
            font-weight: bold;
            transform: scale(1.05);
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.6);
        }
    </style>
</head>
<body>

<div class="player-card">
    <h1>🎵 ដាក់បញ្ចូលបទចម្រៀងរបស់អ្នក</h1>
    
    <!-- ប្រអប់សម្រាប់Upload ឯកសារចម្រៀងពីទូរស័ព្ទ -->
    <div class="upload-box">
        <input type="file" id="audioUpload" accept="audio/*">
    </div>

    <audio id="audio" controls></audio>

    <!-- ប្រអប់បង្ហាញទំនុកច្រៀងរត់តាមសម្លេង -->
    <div class="lyrics-container" id="lyrics">
        <div class="line" data-time="0">សូមជ្រើសរើសፋាយចម្រៀងពីទូរស័ព្ទរបស់អ្នក...</div>
        <div class="line" data-time="3">ឃ្លាទី១៖ បទចម្រៀងនឹងចាប់ផ្តើមបន្លឺឡើង...</div>
        <div class="line" data-time="8">ឃ្លាទី២៖ សូមរីករាយស្តាប់ និងច្រៀងតាមទាំងអស់គ្នា...</div>
        <div class="line" data-time="15">ឃ្លាទី៣៖ អ្នកអាចកែសម្រួលអត្ថបទ និងម៉ោងតាមចិត្ត...</div>
    </div>
</div>

<script>
    const audioUpload = document.getElementById('audioUpload');
    const audio = document.getElementById('audio');
    const lyricLines = document.querySelectorAll('.line');
    const lyricsContainer = document.getElementById('lyrics');

    // មុខងារអានဖាយ MP3 ដែលបាន Upload ចូលពីទូរស័ព្ទ
    audioUpload.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const fileURL = URL.createObjectURL(file);
            audio.src = fileURL;
            audio.play();
        }
    });

    // មុខងារអូសរំកិលអត្ថបទ Lyric តាមវិនាទីនៃបទចម្រៀង
    audio.addEventListener('timeupdate', () => {
        let currentTime = audio.currentTime;
        let activeLine = null;

        lyricLines.forEach((line) => {
            let time = parseFloat(line.getAttribute('data-time'));
            if (currentTime >= time) {
                activeLine = line;
            }
        });

        if (activeLine) {
            lyricLines.forEach(l => l.classList.remove('active'));
            activeLine.classList.add('active');

            let offsetTop = activeLine.offsetTop - lyricsContainer.offsetTop;
            lyricsContainer.scrollTop = offsetTop - 50;
        }
    });
</script>

</body>
</html>
