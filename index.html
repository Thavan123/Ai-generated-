<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator Pro</title>
    <style>
        body {
            font-family: sans-serif;
            background: #0f172a;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        input, select {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 12px 20px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #4f46e5; }
        .result-container {
            margin-top: 20px;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>បង្កើតរូបភាព AI ស្អាតៗ 🎨</h2>
        <p style="font-size: 14px; color: #94a3b8;">វាយបញ្ចូលការពណ៌នា និងជ្រើសរើសស្ទីល៖</p>
        
        <input type="text" id="promptInput" placeholder="ဥទាហរណ៍: a cute tiger in jungle">
        
        <select id="styleSelect">
            <option value="masterpiece, best quality">ស្ទាយទូទៅ (Default)</option>
            <option value="anime style, vibrant colors">ស្ទីលគំនូរជីវចល (Anime)</option>
            <option value="photorealistic, 8k resolution">ស្ទីលថតរូបពិត (Realistic)</option>
            <option value="fantasy concept art, magical">ស្ទីលរឿងនិទាន/ហ្វែនតាស៊ី (Fantasy)</option>
        </select>

        <button onclick="generateImage()">បង្កើតរូបភាព</button>

        <div class="result-container">
            <img id="resultImage" src="" alt="Generated Image will appear here">
        </div>
    </div>

    <script>
        function generateImage() {
            const prompt = document.getElementById('promptInput').value.trim();
            const style = document.getElementById('styleSelect').value;
            const imgElement = document.getElementById('resultImage');

            if (!prompt) {
                alert('សូមសរសេរពាក្យពណ៌នារូបភាពជាមុនសិន!');
                return;
            }

            // បង្កើតកូដបញ្ជូនទៅកាន់ Pollinations AI ជាមួយ Random Seed ដើម្បីឱ្យវាដំណើរការចេញរូបភាពថ្មីជានិច្ច
            const fullPrompt = `${prompt}, ${style}`;
            const encodedPrompt = encodeURIComponent(fullPrompt);
            const randomSeed = Math.floor(Math.random() * 100000);
            
            const imageUrl = `https://pollinations.ai/p/${encodedPrompt}?width=512&height=512&seed=${randomSeed}`;

            // ដាក់ Link ចូលទៅក្នុង tag <img> ដោយផ្ទាល់តែម្តង ដើម្បីកុំឱ្យជាប់គាំងកន្លែង Loading
            imgElement.src = imageUrl;
        }
    </script>

</body>
</html>
