<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធបំប្លែងសំឡេងជាអក្សរ (Speech to Text)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 500px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #f39c12;
        }
        .btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: 0.2s;
            margin-bottom: 20px;
        }
        .btn:hover {
            background-color: #27ae60;
            transform: scale(1.05);
        }
        .btn.recording {
            background-color: #e74c3c;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .output-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            min-height: 120px;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            font-size: 15px;
            color: #ecf0f1;
            border: 1px solid rgba(255, 255, 255, 0.1);
            white-space: pre-wrap;
            word-break: break-word;
        }
        .status {
            font-size: 14px;
            color: #f1c40f;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎙️ ប្រព័ន្ធទាញយកអក្សរពីសំឡេង</h1>
    
    <div class="status" id="statusText">ចុចប៊ូតុងด้านក្រោមដើម្បីចាប់ផ្តើមស្តាប់</div>
    
    <button class="btn" id="recordBtn" onclick="toggleRecord()">🔴 ចាប់ផ្តើមស្តាប់</button>
    
    <div class="output-box" id="output">អក្សរដែលបំប្លែងបាននឹងបង្ហាញទីនេះ...</div>
</div>

<script>
    const recordBtn = document.getElementById('recordBtn');
    const statusText = document.getElementById('statusText');
    const output = document.getElementById('output');

    // ពិនិត្យមើលថាតើ Browser គាំទ្រ Web Speech API ដែរឬទេ
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
        alert("Browser របស់អ្នកមិនគាំទ្រមុខងារនេះទេ។ សូមប្រើប្រាស់ Google Chrome ។");
        statusText.innerText = "Browser មិនគាំទ្រ!";
        recordBtn.disabled = true;
    } else {
        const recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'km-KH'; // កំណត់ភាសាខ្មែរ (ឬប្តូរជា 'en-US' សម្រាប់ភាសាអង់គ្លេស)

        let isRecording = false;

        function toggleRecord() {
            if (!isRecording) {
                recognition.start();
            } else {
                recognition.stop();
            }
        }

        recognition.onstart = function() {
            isRecording = true;
            recordBtn.innerText = "⏹️ បញ្ឈប់ការស្តាប់";
            recordBtn.classList.add("recording");
            statusText.innerText = "កំពុងស្តាប់សម្លេង... សូមនិយាយ ឬចាក់ចម្រៀង";
        };

        recognition.onresult = function(event) {
            let transcript = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                transcript += event.results[i][0].transcript;
            }
            output.innerText = transcript;
        };

        recognition.onerror = function(event) {
            console.error("Speech recognition error", event.error);
            statusText.innerText = "មានបញ្ហា៖ " + event.error;
        };

        recognition.onend = function() {
            isRecording = false;
            recordBtn.innerText = "🔴 ចាប់ផ្តើមស្តាប់";
            recordBtn.classList.remove("recording");
            statusText.innerText = "បានបញ្ឈប់ការស្តាប់។";
        };
    }
</script>

</body>
</html>
